<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fordo NDI Streamer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111827;
    color: #f9fafb;
}

header {
    padding: 22px 28px;
    background: #0b1220;
    border-bottom: 1px solid #374151;
}

header h1 {
    margin: 0;
}

header p {
    color: #94a3b8;
    margin-bottom: 0;
}

main {
    max-width: 1150px;
    margin: auto;
    padding: 28px 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
}

.card,
.panel {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 12px;
}

.card {
    padding: 18px;
}

.label {
    color: #94a3b8;
    font-size: 13px;
}

.value {
    font-size: 23px;
    font-weight: bold;
    margin-top: 8px;
}

.panel {
    padding: 22px;
    margin-bottom: 22px;
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.badge {
    padding: 7px 12px;
    border-radius: 20px;
    background: #374151;
}

#preview-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

#preview-status::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
}

#preview-status.status-stopped {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid #ef4444;
    color: #fca5a5;
}

#preview-status.status-stopped::before {
    background: #ef4444;
}

#preview-status.status-live {
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid #22c55e;
    color: #86efac;
}

#preview-status.status-connecting {
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid #f59e0b;
    color: #fcd34d;
}

#preview-status.status-connecting::before {
    background: #f59e0b;
}

#preview-status.status-live::before {
    background: #22c55e;
}

.source,
.interface {
    margin-top: 12px;
    padding: 15px;
    border-radius: 8px;
    background: #111827;
    border: 1px solid #374151;
}

.source-name {
    font-weight: bold;
    font-size: 18px;
}

.secondary {
    margin-top: 5px;
    color: #94a3b8;
    font-family: monospace;
}

.status-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 20px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #f59e0b;
}

.empty {
    color: #94a3b8;
    text-align: center;
    padding: 35px;
}

.preview-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 16px 0;
}

.preview-controls select,
.preview-controls button {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #4b5563;
    font-size: 14px;
}

.preview-controls select {
    flex: 1;
    min-width: 250px;
    background: #111827;
    color: #f9fafb;
}

.preview-controls button {
    cursor: pointer;
    font-weight: bold;
}

.preview-area {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid #374151;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.preview-area img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
}

.preview-placeholder {
    color: #94a3b8;
    text-align: center;
    padding: 20px;
}


footer {
    text-align: center;
    color: #64748b;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h1>Fordo NDI Streamer</h1>
    <p>Raspberry Pi NDI Streaming Appliance</p>
</header>

<main>

<div class="status-row">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">Connecting...</span>
</div>

<div class="grid">

    <div class="card">
        <div class="label">CPU</div>
        <div class="value" id="cpu">--</div>
    </div>

    <div class="card">
        <div class="label">Temperature</div>
        <div class="value" id="temperature">--</div>
    </div>

    <div class="card">
        <div class="label">Memory</div>
        <div class="value" id="memory">--</div>
    </div>

    <div class="card">
        <div class="label">NDI Sources</div>
        <div class="value" id="ndi-count">0</div>
    </div>

</div>

<div class="panel">

    <div class="panel-header">
        <h2>NDI Sources</h2>
        <span class="badge" id="source-badge">0 detected</span>
    </div>

    <div id="sources">
        <div class="empty">
            Searching for NDI sources...
        </div>
    </div>

</div>

<div class="panel">

    <div class="panel-header">
        <h2>Live NDI Preview</h2>
        <span class="badge status-stopped" id="preview-status">Stopped</span>
    </div>

    <div class="preview-controls">
        <select id="preview-source">
            <option value="">Select an NDI source</option>
        </select>

        <button id="start-preview">Start Preview</button>
        <button id="stop-preview">Stop Preview</button>
    </div>

    <div class="preview-area">
        <div class="preview-placeholder" id="preview-placeholder">
            Select an NDI source and click Start Preview
        </div>

        <img id="preview-image" alt="Live NDI Preview">
    </div>

</div>


<div class="panel">

    <div class="panel-header">
        <h2>Network</h2>
        <span class="badge" id="hostname">--</span>
    </div>

    <div id="network"></div>

</div>

<footer>
Fordo NDI Streamer v0.1.0
</footer>

</main>

<script>

const statusDot = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");


const previewSource = document.getElementById("preview-source");
const savedPreviewSource = localStorage.getItem("fordoPreviewSource") || "";

const previewImage = document.getElementById("preview-image");
const previewPlaceholder = document.getElementById("preview-placeholder");
const previewStatus = document.getElementById("preview-status");

let previewWanted = false;
let previewReconnectTimer = null;
let activePreviewSource = "";

function setPreviewStatus(text, state) {
    previewStatus.textContent = text;
    previewStatus.classList.remove(
        "status-live",
        "status-stopped",
        "status-connecting"
    );

    if (state === "live") {
        previewStatus.classList.add("status-live");
    } else if (state === "connecting") {
        previewStatus.classList.add("status-connecting");
    } else {
        previewStatus.classList.add("status-stopped");
    }
}

function updatePreviewSources(items) {
    const current = previewSource.value;

    previewSource.innerHTML =
        '<option value="">Select an NDI source</option>';

    items.forEach(source => {
        const option = document.createElement("option");
        option.value = source.name;
        option.textContent = source.name;
        previewSource.appendChild(option);
    });

    if (items.some(source => source.name === current)) {
        previewSource.value = current;
    } else if (
        savedPreviewSource &&
        items.some(source => source.name === savedPreviewSource)
    ) {
        previewSource.value = savedPreviewSource;
    }
}

function startPreview() {
    const source = previewSource.value;

    if (!source) {
        setPreviewStatus("Select source", "stopped");
        return;
    }

    previewWanted = true;
    activePreviewSource = source;

    previewImage.src =
        "/api/preview?source=" +
        encodeURIComponent(source) +
        "&t=" + Date.now();

    previewImage.style.display = "block";
    previewPlaceholder.style.display = "none";

    setPreviewStatus("Connecting", "connecting");
}

function stopPreview() {
    previewWanted = false;
    activePreviewSource = "";

    if (previewReconnectTimer) {
        clearTimeout(previewReconnectTimer);
        previewReconnectTimer = null;
    }

    previewImage.src = "";
    previewImage.style.display = "none";
    previewPlaceholder.style.display = "block";

    setPreviewStatus("Stopped", "stopped");
}

previewSource.addEventListener("change", () => {
    if (previewSource.value) {
        localStorage.setItem(
            "fordoPreviewSource",
            previewSource.value
        );
    }
});

document.getElementById("start-preview")
    .addEventListener("click", startPreview);

document.getElementById("stop-preview")
    .addEventListener("click", stopPreview);

previewImage.onerror = () => {
    if (!previewWanted || !activePreviewSource) {
        return;
    }

    setPreviewStatus("Reconnecting", "connecting");
    previewImage.style.display = "none";
    previewPlaceholder.style.display = "block";
    previewPlaceholder.textContent =
        "NDI source unavailable. Reconnecting...";

    if (previewReconnectTimer) {
        clearTimeout(previewReconnectTimer);
    }

    previewReconnectTimer = setTimeout(() => {
        if (!previewWanted || !activePreviewSource) {
            return;
        }

        previewImage.src =
            "/api/preview?source=" +
            encodeURIComponent(activePreviewSource) +
            "&t=" + Date.now();

        previewImage.style.display = "block";
        previewPlaceholder.style.display = "none";
    }, 3000);
};

previewImage.onload = () => {
    if (!previewWanted) {
        return;
    }

    setPreviewStatus("LIVE", "live");
    previewPlaceholder.textContent =
        "Select an NDI source and click Start Preview";
};

function render(data) {

    document.getElementById("cpu").textContent =
        data.system.cpu_percent.toFixed(1) + "%";

    document.getElementById("memory").textContent =
        data.system.memory_percent.toFixed(1) + "%";

    document.getElementById("temperature").textContent =
        data.system.temperature_c !== null
        ? data.system.temperature_c + "°C"
        : "N/A";

    document.getElementById("ndi-count").textContent =
        data.sources.count;

    document.getElementById("source-badge").textContent =
        data.sources.count + " detected";

    document.getElementById("hostname").textContent =
        data.system.hostname;

    updatePreviewSources(data.sources.items);

    if (previewWanted && activePreviewSource) {
        const sourceAvailable = data.sources.items.some(
            source => source.name === activePreviewSource
        );

        if (!sourceAvailable) {
            if (previewReconnectTimer) {
                clearTimeout(previewReconnectTimer);
                previewReconnectTimer = null;
            }

            previewImage.src = "";
            previewImage.style.display = "none";
            previewPlaceholder.style.display = "block";
            previewPlaceholder.textContent =
                "NDI source unavailable. Reconnecting...";

            setPreviewStatus("Reconnecting", "connecting");
        }
        else if (previewStatus.textContent === "Reconnecting") {
            setPreviewStatus("Connecting", "connecting");

            previewImage.src =
                "/api/preview?source=" +
                encodeURIComponent(activePreviewSource) +
                "&t=" + Date.now();

            previewImage.style.display = "block";
            previewPlaceholder.style.display = "none";
        }
    }

    const sources = document.getElementById("sources");

    if (!data.sources.items.length) {

        sources.innerHTML =
            '<div class="empty">' +
            'No NDI sources currently detected.' +
            '</div>';

    } else {

        sources.innerHTML = "";

        data.sources.items.forEach(source => {

            const div = document.createElement("div");
            div.className = "source";

            const name = document.createElement("div");
            name.className = "source-name";
            name.textContent = source.name;

            const address = document.createElement("div");
            address.className = "secondary";
            address.textContent =
                source.url || "Address not reported";

            div.appendChild(name);
            div.appendChild(address);

            sources.appendChild(div);
        });
    }

    const network = document.getElementById("network");
    network.innerHTML = "";

    data.system.network_interfaces.forEach(iface => {

        const div = document.createElement("div");
        div.className = "interface";

        let text =
            iface.name +
            " — " +
            (iface.ipv4 || "No IPv4") +
            " — " +
            (iface.up ? "UP" : "DOWN");

        if (iface.speed_mbps) {
            text += " — " + iface.speed_mbps + " Mbps";
        }

        div.textContent = text;

        network.appendChild(div);
    });
}

function connect() {

    const protocol =
        location.protocol === "https:" ? "wss" : "ws";

    const ws = new WebSocket(
        protocol + "://" +
        location.host +
        "/ws/status"
    );

    ws.onopen = () => {

        statusDot.style.background = "#22c55e";

        statusText.textContent =
            "Fordo services online";
    };

    ws.onmessage = event => {
        render(JSON.parse(event.data));
    };

    ws.onclose = () => {

        statusDot.style.background = "#ef4444";

        statusText.textContent =
            "Connection lost - reconnecting...";

        setTimeout(connect, 2000);
    };
}

connect();

</script>

</body>
</html>
